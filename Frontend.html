<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b6b67">
  <title>Paywise | Employee Payroll</title>
  <style>
    :root { --ink:#173a3e; --muted:#667d80; --brand:#0b6b67; --brand-dark:#07534f; --mist:#eff8f6; --paper:#fff; --line:#dce8e6; --danger:#bb3e3e; --warning:#9a6514; --shadow:0 18px 45px rgba(24,60,61,.10); }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:linear-gradient(135deg,#f4fbfa 0%,#f8f8f3 100%); color:var(--ink); font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    .shell { max-width:1240px; margin:auto; padding:28px 22px 52px; } .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:32px; } .brand { display:flex; align-items:center; gap:11px; font-weight:800; font-size:1.14rem; letter-spacing:-.02em; } .brand-mark { display:grid; place-items:center; width:37px; height:37px; color:white; background:var(--brand); border-radius:12px; font-size:1.1rem; box-shadow:0 7px 17px rgba(11,107,103,.25); } .status { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:.84rem; } .status i { width:8px; height:8px; background:#4da872; border-radius:50%; box-shadow:0 0 0 4px #dff3e5; }
    .hero { display:grid; grid-template-columns:1.35fr .65fr; gap:24px; padding:34px; border-radius:24px; color:#fff; background:linear-gradient(120deg,#0a5d59,#0f7771); box-shadow:var(--shadow); overflow:hidden; position:relative; } .hero:after { content:""; position:absolute; width:300px; height:300px; border:52px solid rgba(255,255,255,.07); border-radius:50%; right:-105px; top:-157px; } .hero h1 { margin:0 0 9px; font-size:clamp(2rem,5vw,3.4rem); letter-spacing:-.055em; line-height:1.05; } .hero p { max-width:560px; margin:0; color:#d4efeb; font-size:1rem; } .hero-actions { display:flex; gap:10px; align-items:end; justify-content:flex-end; position:relative; z-index:1; }
    .btn { appearance:none; border:0; border-radius:10px; padding:10px 15px; font:700 .88rem inherit; cursor:pointer; text-decoration:none; transition:.2s ease; display:inline-flex; align-items:center; justify-content:center; gap:7px; } .btn:hover { transform:translateY(-1px); } .btn-primary { color:var(--brand); background:#fff; box-shadow:0 5px 16px rgba(0,0,0,.12); } .btn-secondary { color:var(--brand); border:1px solid var(--line); background:#fff; } .btn-danger { color:#fff; background:var(--danger); } .btn-plain { color:var(--muted); background:transparent; } .icon { font-size:1.05em; }
    .dashboard { display:grid; grid-template-columns:1fr 1.65fr; gap:24px; margin-top:24px; } .panel { background:var(--paper); border:1px solid rgba(220,232,230,.85); border-radius:18px; box-shadow:0 8px 24px rgba(28,60,60,.055); } .summary { padding:22px; } .eyebrow { margin:0 0 4px; color:var(--muted); font-weight:700; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; } .stat { margin:0; font-size:2.5rem; font-weight:800; letter-spacing:-.06em; } .stat-label { color:var(--muted); } .summary-line { height:1px; margin:20px 0; background:var(--line); } .summary p { margin:0; color:var(--muted); font-size:.9rem; }
    .workspace { min-height:320px; padding:25px; } .section-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:19px; } .section-heading h2 { margin:0; font-size:1.32rem; letter-spacing:-.03em; } .section-heading p { margin:3px 0 0; color:var(--muted); font-size:.9rem; } .empty { display:grid; min-height:215px; place-items:center; text-align:center; padding:20px; border:1px dashed #c8dcd8; border-radius:14px; background:linear-gradient(135deg,#fbfefd,#f6fbfa); } .empty .empty-icon { display:grid; place-items:center; width:50px; height:50px; margin:auto auto 10px; border-radius:15px; color:var(--brand); background:var(--mist); font-size:1.45rem; } .empty h3 { margin:0 0 5px; } .empty p { max-width:320px; margin:0 0 15px; color:var(--muted); }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px 18px; } .field { display:grid; gap:6px; color:#3f585b; font-size:.83rem; font-weight:700; } .field.full { grid-column:1 / -1; } input { width:100%; padding:10px 11px; border:1px solid #cadbd8; border-radius:9px; outline:0; color:var(--ink); background:#fcfefd; font:inherit; transition:.15s; } input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(11,107,103,.13); background:#fff; } .form-actions { display:flex; gap:9px; justify-content:flex-end; margin-top:22px; } .form-actions .btn-primary { color:#fff; background:var(--brand); box-shadow:none; }
    .table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; } table { width:100%; min-width:820px; border-collapse:collapse; font-size:.86rem; } th { padding:11px 12px; color:#637a7c; background:#f5faf9; font-weight:700; text-align:left; white-space:nowrap; } td { padding:13px 12px; border-top:1px solid #edf3f2; vertical-align:middle; } tr:hover td { background:#fbfefd; } .employee { font-weight:750; } .subtle { color:var(--muted); font-size:.81rem; } .money { font-variant-numeric:tabular-nums; white-space:nowrap; } .net { color:var(--brand-dark); font-weight:800; } .row-actions { display:flex; gap:6px; } .tiny { padding:6px 9px; font-size:.78rem; } .table-foot { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:14px; color:var(--muted); font-size:.85rem; }
    .alert { position:fixed; z-index:10; right:22px; top:22px; padding:12px 15px; color:#fff; border-radius:10px; background:var(--ink); box-shadow:var(--shadow); animation:slide .25s ease-out; } .alert.success { background:var(--brand); } .alert.danger { background:var(--danger); } @keyframes slide { from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1} }
    @media (max-width:760px) { .shell{padding:18px 14px 35px}.hero{grid-template-columns:1fr;padding:26px 22px}.hero-actions{justify-content:flex-start;align-items:start}.dashboard{grid-template-columns:1fr;gap:15px}.workspace{padding:19px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.topbar{margin-bottom:20px}.section-heading{align-items:flex-start;flex-direction:column}.table-foot{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><span class="brand-mark">₹</span> Paywise</div><div class="status"><i></i> Your payroll is saved locally</div></header>
    <section class="hero"><div><h1>Payroll, made calmer.</h1><p>Keep employee salary records organised, accurate, and pleasant to work with.</p></div><div class="hero-actions"><button class="btn btn-primary" onclick="showAddForm()"><span class="icon">＋</span> Add employee</button></div></section>
    <section class="dashboard">
      <aside class="panel summary"><p class="eyebrow">Employee records</p><p class="stat" id="account-count">0</p><p class="stat-label">people on payroll</p><div class="summary-line"></div><p>Salary totals update automatically as you add or edit a record.</p></aside>
      <section class="panel workspace"><div id="main-menu"></div><div id="form-section" hidden></div><div id="accounts-section" hidden></div></section>
    </section>
  </main>
  <div id="alerts" aria-live="polite"></div>
  <script>
    const storageKey = 'paywise-accounts';
    let accounts = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const money = value => new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', maximumFractionDigits:0}).format(value || 0);
    const save = () => { localStorage.setItem(storageKey, JSON.stringify(accounts)); updateCount(); };
    const updateCount = () => document.getElementById('account-count').textContent = accounts.length;
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    function showAlert(message, type='success') { const box=document.getElementById('alerts'); box.innerHTML=`<div class="alert ${type}">${message}</div>`; setTimeout(()=>box.innerHTML='',2800); }
    function hideViews() { document.getElementById('form-section').hidden=true; document.getElementById('accounts-section').hidden=true; document.getElementById('main-menu').hidden=false; }
    function showHome() { hideViews(); document.getElementById('main-menu').innerHTML=`<div class="section-heading"><div><h2>Welcome back</h2><p>Choose an action to manage your payroll.</p></div></div>${accounts.length ? `<button class="btn btn-secondary" onclick="showAccounts()">View employee records <span class="icon">→</span></button>` : `<div class="empty"><div><div class="empty-icon">⌁</div><h3>Your payroll starts here</h3><p>Add the first employee record to see everything in one tidy place.</p><button class="btn btn-primary" style="background:var(--brand);color:#fff" onclick="showAddForm()">Add first employee</button></div></div>`}`; }
    function formMarkup(account={}) { const editing=Boolean(account.accNo); const field=(name,label,type='text',full=false)=>`<label class="field ${full?'full':''}">${label}<input type="${type}" name="${name}" value="${escapeHtml(account[name] ?? '')}" ${name==='name'||name==='accNo'?'required':''} ${name==='accNo'&&editing?'readonly':''} ${type==='number'?'min="0" step="1"':''}></label>`; return `<div class="section-heading"><div><h2>${editing ? `Edit ${escapeHtml(account.name)}` : 'Add an employee'}</h2><p>${editing ? 'Update the employee details and salary components.' : 'Enter the salary components—totals are calculated for you.'}</p></div></div><form onsubmit="${editing?`modifyAccount(event,${account.accNo})`:'addAccount(event)'}"><div class="form-grid">${!editing?field('accNo','Employee ID','number'):''}${field('name','Full name')}${field('des','Designation')}${field('add','Work location', 'text', true)}${field('ba','Basic salary','number')}${field('da','Dearness allowance','number')}${field('ta','Travel allowance','number')}${field('hra','House rent allowance','number')}${field('pf','Provident fund','number')}${field('esi','Employee state insurance','number')}</div><div class="form-actions"><button type="button" class="btn btn-plain" onclick="showHome()">Cancel</button><button class="btn btn-primary" type="submit">${editing?'Save changes':'Add employee'}</button></div></form>`; }
    function showAddForm() { document.getElementById('main-menu').hidden=true; document.getElementById('accounts-section').hidden=true; const section=document.getElementById('form-section'); section.hidden=false; section.innerHTML=formMarkup(); }
    function values(form) { const get=n=>Number(form[n].value)||0; return {accNo:Number(form.accNo.value),name:form.name.value.trim(),des:form.des.value.trim(),add:form.add.value.trim(),ba:get('ba'),da:get('da'),ta:get('ta'),hra:get('hra'),pf:get('pf'),esi:get('esi')}; }
    function calculate(a) { a.gs=a.ba+a.da+a.ta+a.hra; a.gd=a.pf+a.esi; a.ns=a.gs-a.gd; return a; }
    function addAccount(event) { event.preventDefault(); const account=calculate(values(event.target)); if(accounts.some(a=>a.accNo===account.accNo)){showAlert('That employee ID is already in use.','danger');return;} accounts.push(account);save();showAlert('Employee added to payroll.');showAccounts(); }
    function modifyAccount(event, accNo) { event.preventDefault(); const index=accounts.findIndex(a=>a.accNo===accNo); const account=calculate({...values(event.target),accNo}); if(index<0)return;accounts[index]=account;save();showAlert('Employee record updated.');showAccounts(); }
    function showModifyForm(accNo) { const account=accounts.find(a=>a.accNo===accNo); if(!account)return;document.getElementById('main-menu').hidden=true;document.getElementById('accounts-section').hidden=true;const section=document.getElementById('form-section');section.hidden=false;section.innerHTML=formMarkup(account); }
    function deleteAccount(accNo) { const account=accounts.find(a=>a.accNo===accNo);if(!account||!confirm(`Remove ${account.name} from payroll?`))return;accounts=accounts.filter(a=>a.accNo!==accNo);save();showAlert('Employee record removed.','danger');showAccounts(); }
    function showAccounts() { document.getElementById('main-menu').hidden=true;document.getElementById('form-section').hidden=true;const section=document.getElementById('accounts-section');section.hidden=false;const rows=accounts.map(a=>`<tr><td class="subtle">#${a.accNo}</td><td><div class="employee">${escapeHtml(a.name)}</div><div class="subtle">${escapeHtml(a.des||'No designation')}</div></td><td>${escapeHtml(a.add||'—')}</td><td class="money">${money(a.ba)}</td><td class="money">${money(a.da+a.ta+a.hra)}</td><td class="money">${money(a.gd)}</td><td class="money net">${money(a.ns)}</td><td><div class="row-actions"><button class="btn btn-secondary tiny" onclick="showModifyForm(${a.accNo})">Edit</button><button class="btn btn-danger tiny" onclick="deleteAccount(${a.accNo})">Remove</button></div></td></tr>`).join('');section.innerHTML=`<div class="section-heading"><div><h2>Employee records</h2><p>Review salary totals and keep details up to date.</p></div><button class="btn btn-primary" style="background:var(--brand);color:#fff;box-shadow:none" onclick="showAddForm()">＋ Add employee</button></div>${accounts.length?`<div class="table-wrap"><table><thead><tr><th>Employee ID</th><th>Employee</th><th>Location</th><th>Basic</th><th>Allowances</th><th>Deductions</th><th>Net salary</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><div class="table-foot"><span>${accounts.length} employee${accounts.length===1?'':'s'} on payroll</span><button class="btn btn-plain" onclick="showHome()">← Back to overview</button></div>`:`<div class="empty"><div><div class="empty-icon">⌁</div><h3>No employee records yet</h3><p>Add the first person to begin building your payroll.</p><button class="btn btn-primary" style="background:var(--brand);color:#fff" onclick="showAddForm()">Add employee</button></div></div>`}`; }
    updateCount();showHome();
  </script>
</body>
</html>
